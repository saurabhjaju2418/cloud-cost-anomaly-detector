services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cloudcost
      POSTGRES_USER: cloudcost
      POSTGRES_PASSWORD: cloudcost
    ports: ["5432:5432"]
    volumes: ["cost-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcost"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/cloudcost
      DATABASE_USER: cloudcost
      DATABASE_PASSWORD: cloudcost
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  cost-data:

